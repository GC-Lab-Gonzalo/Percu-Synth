<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PercuSynth · armado de la placa</title>
<link rel="preconnect" href="https://fonts.googleapis.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet" crossorigin>
<style>
  /* Misma escena que el simulador: una mesa de nogal de noche vista desde arriba, medida en
     "unidades de escenario" (1600 × 1000 u) que se ajustan a la ventana sin scroll. */
  :root {
    --tinta:#f3e3c4; --gris:#b9aa8e; --suave:#857760; --ambar:#F5B041; --error:#ff8a73; --ok:#8fd99f;
    --mono: Consolas, "Cascadia Mono", ui-monospace, monospace;
  }
  * { box-sizing:border-box; }
  html, body { margin:0; height:100%; background:#000; color:var(--tinta); font-family:Archivo, system-ui, sans-serif; overflow:hidden; }
  .escenario { position:fixed; left:50%; top:50%; width:min(100vw, 160vh); width:min(100vw, 160dvh); aspect-ratio:1600 / 1000;
    transform:translate(-50%, -50%); container-type:inline-size; user-select:none; -webkit-user-select:none; overflow:hidden;
    --u:calc(100cqw / 1600); background:#000; }
  @media (orientation:portrait) and (pointer:coarse) {
    .escenario { width:min(100vh, 160vw); width:min(100dvh, 160vw); transform:translate(-50%, -50%) rotate(90deg); }
  }
  .escenario > svg { position:absolute; left:0; top:0; width:100%; height:100%; display:block; touch-action:none; }

  .capa { position:absolute; font-size:calc(14 * var(--u)); line-height:1.42; color:var(--tinta);
    text-shadow:0 0 calc(5 * var(--u)) #000, 0 0 calc(2 * var(--u)) #000; }
  .ar { border-left:calc(2.5 * var(--u)) solid var(--ambar); padding-left:calc(16 * var(--u)); }
  .enlace { background:none; border:0; padding:0; cursor:pointer; color:var(--tinta); font:inherit; text-shadow:inherit;
    text-decoration:underline; text-decoration-color:#f5b04170; text-underline-offset:.2em; }
  .enlace:hover { color:var(--ambar); }
  .enlace.on { color:var(--ambar); text-decoration-color:var(--ambar); }
  .enlace:disabled { color:var(--suave); cursor:default; text-decoration:none; }
  .enlace:focus-visible { outline:calc(2 * var(--u)) solid var(--ambar); outline-offset:2px; }

  .barra { left:calc(40 * var(--u)); right:calc(40 * var(--u)); top:calc(26 * var(--u)); display:flex; align-items:baseline;
    gap:calc(22 * var(--u)); font-size:calc(14 * var(--u)); white-space:nowrap; }
  .barra b { color:var(--ambar); font-weight:600; font-size:calc(16 * var(--u)); margin-right:calc(8 * var(--u)); }
  .barra .vistas { display:flex; gap:calc(12 * var(--u)); margin-right:calc(14 * var(--u)); padding-right:calc(22 * var(--u)); border-right:1px solid #f5b04155; }
  .barra .soloPlaca { display:flex; gap:calc(22 * var(--u)); }
  .barra .cuenta { margin-left:auto; color:var(--gris); font-family:var(--mono); font-size:calc(13 * var(--u)); }

  .panel { left:calc(1032 * var(--u)); top:calc(88 * var(--u)); width:calc(530 * var(--u)); height:calc(590 * var(--u));
    display:flex; flex-direction:column; gap:calc(16 * var(--u)); overflow-y:auto; scrollbar-width:none; }
  .panel::-webkit-scrollbar { display:none; }
  .panel .mini { display:block; width:100%; height:calc(170 * var(--u)); flex:none; }
  .panel .mini + .tenue { margin-top:calc(-10 * var(--u)); font-size:calc(12.5 * var(--u)); }
  .panel h2 { margin:0; font-size:calc(21 * var(--u)); font-weight:650; font-stretch:112%; color:var(--ambar); line-height:1.15; }
  .panel h2 small { display:block; font-size:calc(13 * var(--u)); font-weight:400; font-stretch:100%; color:var(--gris); margin-top:calc(4 * var(--u)); }
  .panel p { margin:0; }
  .panel p b { color:#fff4dc; font-weight:600; }
  .panel .pines { font-family:var(--mono); font-size:calc(13 * var(--u)); color:var(--gris); line-height:1.5;
    display:grid; grid-template-columns:auto 1fr; column-gap:calc(12 * var(--u)); }
  .panel .pines span:nth-child(odd) { color:var(--suave); }
  .panel .pines.puentes { grid-template-columns:auto 1fr auto; }
  .panel .pines.puentes span { color:var(--gris); }
  .panel .pines.puentes span:nth-child(3n+1) { color:var(--suave); }
  .panel .pines.puentes span:nth-child(3n) { color:var(--ambar); }
  .panel .acciones { display:flex; gap:calc(22 * var(--u)); }
  .panel .paso { padding-bottom:calc(14 * var(--u)); border-bottom:1px solid #f5b04133; display:flex; flex-direction:column; gap:calc(10 * var(--u)); }
  .panel .paso h2 { font-size:calc(19 * var(--u)); }
  .panel .tenue { color:var(--gris); }
  .bandas { display:inline-flex; gap:calc(3 * var(--u)); vertical-align:middle; margin-right:calc(6 * var(--u)); }
  .bandas i { display:inline-block; width:calc(9 * var(--u)); height:calc(16 * var(--u)); }

  .leyenda { left:calc(1032 * var(--u)); top:calc(716 * var(--u)); width:calc(530 * var(--u)); display:grid; grid-template-columns:1fr 1fr;
    gap:calc(5 * var(--u)) calc(18 * var(--u)); font-size:calc(13 * var(--u)); }
  .leyenda i { display:inline-block; width:calc(22 * var(--u)); height:calc(5 * var(--u)); margin-right:calc(9 * var(--u)); vertical-align:middle; border-radius:2px; }
  .leyenda p { grid-column:1 / -1; margin:calc(8 * var(--u)) 0 0; color:var(--gris); font-size:calc(12.5 * var(--u)); }
  .aviso { left:calc(40 * var(--u)); width:calc(950 * var(--u)); top:calc(682 * var(--u)); text-align:center; color:var(--ambar);
    font-size:calc(15 * var(--u)); font-weight:600; opacity:0; transition:opacity .3s; pointer-events:none; }
  .aviso.ver { opacity:1; }
</style>
</head>
<body>
<div class="escenario" id="escenario">
  <svg id="svg" viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg"></svg>

  <div class="capa barra">
    <b>PercuSynth V2.0</b>
    <span class="vistas"><button class="enlace on" data-vista="placa">placa</button><button class="enlace" data-vista="esquema">esquema</button><button class="enlace" data-vista="cables">cables</button></span>
    <span class="soloPlaca">
    <button class="enlace" id="bArmar">armar todo</button>
    <button class="enlace" id="bDesarmar">desarmar todo</button>
    <button class="enlace" id="bPasos">paso a paso</button>
    <button class="enlace" id="bVuelta">dar vuelta la placa</button>
    <button class="enlace" id="bPistas">ver pistas</button>
    <button class="enlace" id="bCablear" style="display:none">cablear todo</button>
    <button class="enlace" id="bDescablear" style="display:none">quitar cables</button>
    </span>
    <span class="cuenta" id="cuenta"></span>
  </div>

  <div class="capa ar panel" id="panel"></div>
  <div class="capa aviso" id="aviso"></div>
</div>

<script src="pcb_v2.js"></script>
<script src="esquema_v2.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const NS = 'http://www.w3.org/2000/svg';
function E(tag, attrs, parent) {
  const el = document.createElementNS(NS, tag);
  for (const k in attrs) {
    if (k === 'text') el.textContent = attrs[k];
    else el.setAttribute(k, attrs[k]);
  }
  if (parent) parent.appendChild(el);
  return el;
}

// ---------------------------------------------------------------- escena
const BX = 40, BY = 88, S = 1.2;                    // la placa: unidades EasyEDA (10 mil) → escenario
const W = PCB.ancho, H = PCB.alto;
const svg = $('svg');

function texturaMesa() {                            // la misma mesa de nogal del simulador
  const Wt = 800, Ht = 500, c = document.createElement('canvas');
  c.width = Wt; c.height = Ht;
  const g = c.getContext('2d'), img = g.createImageData(Wt, Ht), d = img.data;
  const N = 256, tabla = new Float32Array(N * N);
  let s = 7;
  for (let i = 0; i < N * N; i++) { s = (s * 16807) % 2147483647; tabla[i] = s / 2147483647; }
  const ruido = (x, y) => {
    const xi = Math.floor(x), yi = Math.floor(y), fx = x - xi, fy = y - yi;
    const i0 = (yi & 255) * N, i1 = ((yi + 1) & 255) * N, j0 = xi & 255, j1 = (xi + 1) & 255;
    const a = tabla[i0 + j0], b = tabla[i0 + j1], c2 = tabla[i1 + j0], dd = tabla[i1 + j1];
    const u = fx * fx * (3 - 2 * fx), v = fy * fy * (3 - 2 * fy);
    return a + (b - a) * u + (c2 - a) * v + (a - b - c2 + dd) * u * v;
  };
  const TABLA = 125;
  for (let y = 0; y < Ht; y++) {
    const t = Math.floor(y / TABLA), yy = y % TABLA, off = t * 37.1;
    for (let x = 0; x < Wt; x++) {
      const w = ruido(x * 0.004 + off, y * 0.02) * 6 + ruido(x * 0.02 + off, y * 0.08) * 1.5;
      const veta = Math.sin(y * 0.35 + w * 6) * 0.5 + 0.5;
      const fibra = ruido(x * 0.35 + off, y * 1.3);
      let k = 0.78 + veta * 0.17 + (fibra - 0.5) * 0.12 + (ruido(x * 0.002 + off, t * 3.3) - 0.5) * 0.24;
      if (yy < 1) k *= 0.3;
      const o = (y * Wt + x) * 4;
      d[o] = 96 * k; d[o + 1] = 63 * k; d[o + 2] = 38 * k; d[o + 3] = 255;
    }
  }
  g.putImageData(img, 0, 0);
  return c.toDataURL('image/jpeg', 0.88);
}

svg.innerHTML = `<defs>
  <filter id="sh" x="-10%" y="-10%" width="130%" height="140%"><feDropShadow dx="0" dy="14" stdDeviation="14" flood-color="#000" flood-opacity=".65"/></filter>
  <filter id="sh2" x="-30%" y="-30%" width="160%" height="170%"><feDropShadow dx="0" dy="2.2" stdDeviation="1.8" flood-color="#000" flood-opacity=".7"/></filter>
  <filter id="brillo" x="-200%" y="-200%" width="500%" height="500%"><feGaussianBlur stdDeviation="9"/></filter>
  <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e4e6e8"/><stop offset="1" stop-color="#9ea3a8"/></linearGradient>
  <radialGradient id="estano" cx=".38" cy=".35" r=".7"><stop offset="0" stop-color="#fbfbf8"/><stop offset=".55" stop-color="#b9bcbd"/><stop offset="1" stop-color="#6e7275"/></radialGradient>
  <linearGradient id="hasl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e2e3de"/><stop offset="1" stop-color="#a9aba6"/></linearGradient>
  <linearGradient id="resist" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8fb6e4"/><stop offset=".45" stop-color="#4e86c8"/><stop offset="1" stop-color="#2b5793"/></linearGradient>
  <linearGradient id="diodo" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#4a4a4a"/><stop offset=".45" stop-color="#1c1c1c"/><stop offset="1" stop-color="#080808"/></linearGradient>
  <linearGradient id="ceramico" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#f3c35c"/><stop offset=".5" stop-color="#d9962a"/><stop offset="1" stop-color="#a5661a"/></linearGradient>
  <radialGradient id="aluminio" cx=".4" cy=".35" r=".8"><stop offset="0" stop-color="#eef0f2"/><stop offset="1" stop-color="#9aa0a7"/></radialGradient>
  <linearGradient id="tecla" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3c3c3c"/><stop offset="1" stop-color="#111"/></linearGradient>
  <radialGradient id="perilla" cx=".38" cy=".32" r=".8"><stop offset="0" stop-color="#4a4a4a"/><stop offset="1" stop-color="#0b0b0b"/></radialGradient>
  <linearGradient id="bornera" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#1c4f8c"/><stop offset=".5" stop-color="#2f78c4"/><stop offset="1" stop-color="#235f9f"/></linearGradient>
  <linearGradient id="hembra" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2c2c2c"/><stop offset="1" stop-color="#0c0c0c"/></linearGradient>
</defs>`;
E('image', { href: texturaMesa(), x: 0, y: 0, width: 1600, height: 1000, preserveAspectRatio: 'none' }, svg);

const vistaPlaca = E('g', {}, svg);
const capaBandeja = E('g', {}, vistaPlaca);
E('rect', { x: BX, y: BY, width: W * S, height: H * S, fill: '#000', filter: 'url(#sh)' }, vistaPlaca);
const caraTop = E('g', { id: 'caraTop', transform: `translate(${BX},${BY}) scale(${S})` }, vistaPlaca);
const caraBot = E('g', { id: 'caraBot', transform: `translate(${BX + W * S},${BY}) scale(${-S},${S})`, display: 'none' }, vistaPlaca);
const vistaEsq = E('g', { display: 'none' }, svg);
const vistaCables = E('g', { display: 'none' }, svg);
const capaEncima = E('g', {}, svg);                 // lo que se arrastra y la etiqueta del puntero

// ---------------------------------------------------------------- utilidades de geometría
const nums = s => (s.match(/-?\d*\.?\d+/g) || []).map(Number);
function cajaSilk(lista) {                          // la caja de los trazos gruesos (los contornos, no los textos)
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  for (const [d, w] of lista) {
    if (w < 0.9 || d[0] === 'C') continue;
    const v = nums(d);
    for (let i = 0; i + 1 < v.length; i += 2) { x0 = Math.min(x0, v[i]); x1 = Math.max(x1, v[i]); y0 = Math.min(y0, v[i + 1]); y1 = Math.max(y1, v[i + 1]); }
  }
  return [x0, y0, x1, y1];
}
function dibujarSilk(lista, g, color) {
  for (const [d, w] of lista) {
    if (d[0] === 'C') { const [cx, cy, r] = nums(d); E('circle', { cx, cy, r, fill: 'none', stroke: color, 'stroke-width': w }, g); }
    else if (w === 0) E('path', { d, fill: color }, g);
    else E('path', { d, fill: 'none', stroke: color, 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, g);
  }
}
function texto(g, x, y, str, attrs, cara) {         // en la cara de abajo el grupo va espejado: el texto se vuelve a dar vuelta
  const t = E('text', Object.assign({ x: 0, y: 0, text: str, 'font-family': 'Archivo, sans-serif' }, attrs), g);
  t.setAttribute('transform', cara === 'bot' ? `translate(${x},${y}) scale(-1,1)` : `translate(${x},${y})`);
  if (cara === 'bot' && attrs['text-anchor'] && attrs['text-anchor'] !== 'middle')
    t.setAttribute('text-anchor', attrs['text-anchor'] === 'end' ? 'start' : 'end');
  return t;
}

// ---------------------------------------------------------------- las redes: qué hay en cada punto
const GPIO = { TX:43, BOTON1:44, POT1:1, POT2:2, BOTON2:42, BCK:41, DIN:40, LCK:39, SCL:38, BOTON3:0, BOTON4:45, BOTON5:47,
  SDA:21, MIC1:4, MIC2:5, MIC3:6, MIC4:7, POT3:8, EXT1:3, PIXEL:46, EXT2:9, POT4:10, WS:11, SCK:12, SD:13 };
const FUNCION = { TX:'MIDI TX', BOTON1:'BTN1', BOTON2:'BTN2', BOTON3:'BTN3', BOTON4:'BTN4', BOTON5:'BTN5', POT1:'POT1', POT2:'POT2',
  POT3:'POT3', POT4:'POT4', BCK:'I2S BCK', DIN:'I2S DIN', LCK:'I2S LCK', SCL:'I2C SCL', SDA:'I2C SDA', MIC1:'piezo 1', MIC2:'piezo 2',
  MIC3:'piezo 3', MIC4:'piezo 4', EXT1:'EXT1', EXT2:'EXT2', PIXEL:'datos LEDs', WS:'mic WS', SCK:'mic SCK', SD:'mic SD' };
const POTENCIA = new Set(['GND', '3.3V', '5V']);
function nombreRed(n) {
  if (n === 'GND') return 'GND';
  if (n === '3.3V') return '3,3 V';
  if (n === '5V') return '5 V';
  if (n in GPIO) return `GPIO ${GPIO[n]} · ${FUNCION[n]}`;
  if (n === 'MIDI_OUT_4') return 'R10 → 5 V';
  if (n === 'MIDI_OUT_5') return 'R11 → GPIO 43';
  if (n === 'LED6_4') return 'datos que salen del LED6';
  let m = n.match(/^LED(\d)_\d$/);
  if (m) return `datos LED${m[1] - 1} → LED${m[1]}`;
  return n ? 'sin conexión' : 'aleta: sólo sujeta';
}
const RED = {};                                     // red → pistas, vías y pads
const red = n => RED[n] || (RED[n] = { top: [], bot: [], vias: [], pads: [] });
for (const cara of ['top', 'bot']) for (const [n, w, d] of PCB.pistas[cara]) if (n) red(n)[cara].push([w, d]);
for (const v of PCB.vias) if (v[3]) red(v[3]).vias.push(v);
const comp = id => PCB.comps.find(c => c.id === id);
const ESP = PCB.comps.find(c => c.pkg.startsWith('ESP32'));
// los rótulos de los 44 pines del DevKitC-1, por número de pad (columna derecha 1–22, izquierda 23–44)
const ESP_PIN = ['3V3','3V3','RST','4','5','6','7','15','16','17','18','8','3','46','9','10','11','12','13','14','5V','GND',
                 'GND','43','44','1','2','42','41','40','39','38','37','36','35','0','45','48','47','21','20','19','GND','GND'];

// ---------------------------------------------------------------- las piezas
// bandas de 5 (metal film azul, la que traen los kits): 3 cifras · multiplicador · tolerancia
const COLOR = { cafe:'#6b3a1e', negro:'#121212', rojo:'#c62f2f', naranjo:'#e8772a', amarillo:'#ecc93a', verde:'#2e8b4e' };
const BANDAS = { r1M:['cafe','negro','negro','amarillo','cafe'], r100k:['cafe','negro','negro','naranjo','cafe'], r220:['rojo','rojo','negro','negro','cafe'] };
const TIPOS = {
  r1M:   { nombre:'Resistencia 1 MΩ', pila:'1 MΩ', bandas:BANDAS.r1M,
           que:'Frena el paso de la corriente. No tiene polaridad: da lo mismo hacia qué lado quede.',
           reconoce:'Café · negro · negro · amarillo · café: 1-0-0 y cuatro ceros, 1 000 000 Ω. Si es de cuatro bandas: café · negro · verde.',
           soldar:'Dobla las patas a la medida de los agujeros, pásalas, suelda por abajo y corta lo que sobra.' },
  r100k: { nombre:'Resistencia 100 kΩ', pila:'100 kΩ', bandas:BANDAS.r100k,
           que:'Frena el paso de la corriente. No tiene polaridad.',
           reconoce:'Café · negro · negro · naranjo · café: 1-0-0 y tres ceros, 100 000 Ω. Si es de cuatro bandas: café · negro · amarillo.',
           soldar:'Dobla las patas, pásalas, suelda por abajo y corta lo que sobra.' },
  r220:  { nombre:'Resistencia 220 Ω', pila:'220 Ω', bandas:BANDAS.r220,
           que:'Frena el paso de la corriente. No tiene polaridad.',
           reconoce:'Rojo · rojo · negro · negro · café: 2-2-0 sin ceros, 220 Ω. Si es de cuatro bandas: rojo · rojo · café.',
           soldar:'Dobla las patas, pásalas, suelda por abajo y corta lo que sobra.' },
  diodo: { nombre:'Diodo Schottky 1N5817', pila:'1N5817',
           que:'Deja pasar la corriente en un solo sentido, como una válvula.',
           reconoce:'Cuerpo negro con una franja gris. La franja es el cátodo y va hacia el lado donde la serigrafía dibuja la barra. Al revés no protege nada.',
           soldar:'Igual que una resistencia, pero mirando la franja antes de soldar.' },
  c10n:  { nombre:'Condensador cerámico 10 nF', pila:'10 nF',
           que:'Guarda un poquito de carga por un instante.',
           reconoce:'Lenteja amarilla con el código 103: 10 y tres ceros en picofaradios, 10 000 pF = 10 nF. No tiene polaridad.',
           soldar:'Hasta el fondo, suelda y corta.' },
  c100u: { nombre:'Condensador electrolítico 100 µF', pila:'100 µF',
           que:'Un estanque chico de energía: guarda carga y la entrega cuando el consumo pega un salto.',
           reconoce:'Tiene polaridad. La franja clara del costado marca el negativo (−); la pata larga es el positivo y va al agujero con el +.',
           soldar:'Mira la franja antes de soldar: puesto al revés se calienta y se puede inflar.' },
  led:   { nombre:'LED WS2812B (6028)', pila:'LED WS2812B',
           que:'Un LED de tres colores con un chip adentro. Recibe los colores por un solo cable de datos y le pasa el resto al LED siguiente: van en cadena.',
           reconoce:'Va por debajo de la placa, con la cara que alumbra hacia el agujero: la luz sale por la ventana. Su esquina marcada coincide con la marca de la serigrafía.',
           soldar:'Es de montaje superficial: estaña un pad, apoya el LED con la pinza, recalienta ese pad y después suelda los otros tres. Con lupa.' },
  sw:    { nombre:'Switch mecánico (MX)', pila:'Switch MX',
           que:'El mecanismo del botón: mientras lo aprietas, une sus dos patas.',
           reconoce:'El de los teclados mecánicos. El color de la cruz dice el tacto (rojo lineal, café táctil, azul con clic). El tetón del centro entra en el agujero grande y los dos pines de metal en sus pads.',
           soldar:'Se suelda sin la tecla puesta. Que quede apoyado y derecho contra la placa antes de soldar las dos patas.' },
  tecla: { nombre:'Tecla (keycap)', pila:'Tecla',
           que:'La tapa del botón: es lo que tocas. No tiene nada eléctrico.',
           reconoce:'Por debajo tiene un encastre en cruz (+), el del estándar MX, que calza en la cruz del switch.',
           soldar:'No se suelda: va al final, cuando ya no queda nada que soldar. Se aprieta derecha sobre la cruz hasta el fondo; para sacarla se tira derecho hacia arriba, mejor con un extractor de teclas.' },
  pot:   { nombre:'Potenciómetro B1K', pila:'Potenciómetro',

// ---------------------------------------------------------------- la placa desnuda (una vez por cara)
function placa(cara, g) {
  const otra = cara === 'top' ? 'bot' : 'top';
  E('rect', { x: 0, y: 0, width: W, height: H, rx: 2, fill: '#0b0c0b' }, g);
  const pistasFondo = E('g', { opacity: .55 }, g);                                  // la otra cara, apenas, a través de la fibra
  for (const [, w, d] of PCB.pistas[otra]) E('path', { d, fill: 'none', stroke: '#101210', 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, pistasFondo);
  const pistas = E('g', {}, g);                                                     // las de esta cara, bajo la máscara
  for (const [, w, d] of PCB.pistas[cara]) E('path', { d, fill: 'none', stroke: '#1b1e1b', 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, pistas);
  const cobre = E('g', { display: 'none' }, g);                                     // «ver pistas»: el cobre a la vista
  for (const [, w, d] of PCB.pistas[otra]) E('path', { d, fill: 'none', stroke: '#6b4a2c', 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round', opacity: .55, 'stroke-dasharray': '3 2.2' }, cobre);
  for (const [, w, d] of PCB.pistas[cara]) E('path', { d, fill: 'none', stroke: '#d08a4c', 'stroke-width': w, 'stroke-linecap': 'round', 'stroke-linejoin': 'round' }, cobre);
  for (const [x, y, dia, , hr] of PCB.vias) { E('circle', { cx: x, cy: y, r: dia / 2, fill: '#1e211e' }, g); E('circle', { cx: x, cy: y, r: hr, fill: '#050505' }, g); }
  const silk = E('g', {}, g);
  dibujarSilk(PCB.silk[cara], silk, '#ecebe4');
  for (const c of PCB.comps) dibujarSilk(c.silk[cara], silk, '#ecebe4');
  // las ventanas de los LEDs atraviesan la placa
  const ventanas = {};
  for (const c of PCB.comps) if (c.ventanas) ventanas[c.id] = E('path', { d: c.ventanas[0], fill: '#140d08' }, g);
  // pads: los de agujero se ven por las dos caras; los SMD sólo por la suya
  const pads = E('g', {}, g);
  for (const c of PCB.comps) for (const p of c.pads) {
    if (p.cara !== 'tht' && p.cara !== cara) continue;
    if (p.pts) E('path', { d: p.pts, fill: 'url(#hasl)' }, pads);
    else if (p.w !== p.h) E('rect', { x: p.x - p.w / 2, y: p.y - p.h / 2, width: p.w, height: p.h, rx: Math.min(p.w, p.h) / 2, fill: 'url(#hasl)', transform: p.rot ? `rotate(${p.rot} ${p.x} ${p.y})` : '' }, pads);
    else E('circle', { cx: p.x, cy: p.y, r: p.w / 2, fill: 'url(#hasl)' }, pads);
    if (p.hueco) E('circle', { cx: p.x, cy: p.y, r: p.hueco, fill: '#0a0705' }, pads);
  }
  for (const [x, y, r] of PCB.agujeros) E('circle', { cx: x, cy: y, r, fill: '#140d08' }, g);
  for (const c of PCB.comps) for (const [x, y, r] of c.agujeros) E('circle', { cx: x, cy: y, r, fill: '#140d08' }, g);
  return {
    cobre, pistas, ventanas,
    zonas: E('g', {}, g),          // dónde se puede tocar un lugar vacío
    piezas: E('g', {}, g),
    soldadura: E('g', {}, g),
    luz: E('g', {}, g),
    marca: E('g', { 'pointer-events': 'none' }, g),
    rotulos: E('g', {}, g),
  };
}

function faltaPara(l) {                              // por qué no se puede poner (o '' si se puede)
  for (const d of l.necesita || []) if (!puestas.has(d))
    return l.tipo === 'tecla' ? `Primero va el switch ${d}: la tecla se calza en su cruz.` : `Primero va la ${TIPOS[L[d].tipo].nombre.toLowerCase()}: el módulo se enchufa en ella.`;
  if (l.choca && puestas.has(l.choca)) return `El IMU y la pantalla OLED usan el mismo lugar: saca primero ${l.choca === 'IMU' ? 'el IMU' : 'la pantalla'}.`;
  return '';
}
function encimaDe(l) { return LUGARES.find(m => m.necesita && m.necesita.includes(l.id) && puestas.has(m.id)); }
function poner(l) {
  const f = faltaPara(l);
  if (f) { aviso(f); return false; }
  puestas.add(l.id);
  return true;
}
function sacar(l) {
  const m = encimaDe(l);
  if (m) {
    aviso(m.tipo === 'tecla' ? 'Primero saca la tecla: está calzada en este switch.'
      : `Primero saca ${{ ESP32:'el ESP32', DAC:'el DAC', IMU:'el IMU' }[m.id] || 'la pantalla'}: ${m.id === 'OLED' ? 'está enchufada' : 'está enchufado'} en esta tira.`);
    return false;
  }
  puestas.delete(l.id);
  return true;
}

function transformLugar(l) { return `translate(${l.x},${l.y}) rotate(${l.rot})`; }
function pintar() {
  for (const k of ['top', 'bot']) { const c = CARAS[k];
    c.piezas.innerHTML = ''; c.soldadura.innerHTML = ''; c.zonas.innerHTML = ''; c.luz.innerHTML = ''; }
  const tiposPaso = pasoActual >= 0 ? PASOS[pasoActual].tipos : [];
  for (const l of LUGARES) {
    const puesta = puestas.has(l.id);
    // la zona tocable (vacía o puesta): un rectángulo invisible bajo las piezas
    // (sin zona si falta lo de abajo: tocar ahí elige el switch o la tira, no la tecla o el módulo)
    const sinBase = !puesta && (l.necesita || []).some(d => !puestas.has(d));

        g.addEventListener('pointerdown', e => tocarLugar(e, l));

      const otros = qs.filter(q => q !== enEsp), ym = otros.reduce((s, q) => s + q.y, 0) / otros.length;
      carriles[lado].push({ n, qs: otros, esp: enEsp, baja: ym < enEsp.y });
    } else if (qs.length === 2) LOCALES.push(n);
  }
  // los que bajan al ESP32 primero (el de más arriba, más cerca del módulo), después los que suben: así casi no se cruzan
  for (const lado of ['izq', 'der']) {
    const baja = carriles[lado].filter(c => c.baja).sort((a, b) => a.esp.y - b.esp.y);
    const sube = carriles[lado].filter(c => !c.baja).sort((a, b) => b.esp.y - a.esp.y);
    [...baja, ...sube].forEach((c, i) => { CARRIL[c.n] = Object.assign(c, { x: lado === 'izq' ? ESPC.x - 70 - i * 6 : ESPC.x + 70 + i * 6 }); });
  }
})();
const zC = zoomable(cabSvg, clicEnVista, t => {
  const s = t.closest('[data-lugar]'); if (!s) return null;
  const pc = piezasC.find(([l]) => l.id === s.dataset.lugar);
  return pc && cajaC(pc[0], pc[1], pc[2]);
});
zC.fijar([AREA_C.x, AREA_C.y, AREA_C.w, AREA_C.h]);
// los cables tirados, por red: se ponen y se quitan uno a uno, aparte de las piezas
const TODAS_LAS_REDES = Object.keys(REDES_C).filter(n => REDES_C[n].length > 1 || POTENCIA.has(n));
const conectados = new Set(TODAS_LAS_REDES);
function suelto(q) {                               // un cable tirado cuya otra punta todavía no está: queda colgando
  const [dx, dy] = DIR[q.sal], ex = q.x + dx * (q.largo + 8), ey = q.y + dy * (q.largo + 8);
  cable(q.p.red, [[q.x, q.y], [ex, ey]], 2.6);
  E('circle', { cx: ex, cy: ey, r: 2.4, fill: '#120c07', stroke: COLOR_RED(q.p.red), 'stroke-width': 1.4 }, cablesPorRed[q.p.red]);
}
function conectar(n) {
  conectados.add(n);
  const faltan = [...new Set(REDES_C[n].filter(q => !estaC(q.l)).map(q => titulo(q.l).split(' · ')[0]))];
  if (!POTENCIA.has(n)) { elegidoRed = n; elegido = null; }
  pintar();
  aviso(POTENCIA.has(n) ? `${nombreRed(n)} conectado: todos los pines ${nombreRed(n)} quedan unidos.`
    : `Cable tirado: ${nombreRed(n)}.${faltan.length ? ' Para que llegue a todas sus puntas falta poner ' + faltan.join(', ') + '.' : ''}`);
}

const estaC = l => puestas.has(l.id);
function pintarCables() {
  capaCables.innerHTML = ''; capaPiezasC.innerHTML = ''; capaPuntas.innerHTML = ''; capaAnillos.innerHTML = '';
  cablesPorRed = {};
  // las piezas: las puestas enteras; las que faltan, como un fantasma punteado en su lugar
  for (const [l, pos, esc] of piezasC) {
    const puesta = estaC(l);
    const g = E('g', { transform: `translate(${pos.x},${pos.y}) rotate(${pos.rot}) scale(${esc})`, 'data-lugar': l.id, style: 'cursor:pointer' }, capaPiezasC);
    const cuerpo = E('g', { opacity: puesta ? (pos.tenue ? .6 : 1) : .14 }, g);
    pieza(Object.assign({}, l, { rot: 0 }), cuerpo);
    const [x0, y0, x1, y1] = cajaLocal(l);
    E('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, fill: 'transparent', stroke: puesta ? 'none' : '#f3e3c4', 'stroke-opacity': .45,
      'stroke-width': 1 / esc, 'stroke-dasharray': `${4 / esc} ${3 / esc}` }, g);
    if (pos.tenue) E('text', { x: 0, y: 66, 'font-size': 11, 'text-anchor': 'middle', fill: '#b9aa8e', 'font-family': 'Archivo, sans-serif', text: 'opcional' }, g);
  }
  // los rótulos de los pines del ESP32, sobre el módulo
  const espOn = estaC(L.ESP32);
  for (const pin of PINES_ESP) {
    const izq = pin.x < ESPC.x, rot = ESP_PIN[+pin.p.n - 1], num = /^\d+$/.test(rot);
    E('text', { x: pin.x + (izq ? 6 : -6), y: pin.y + 2.8, 'font-size': 7.6, 'font-family': 'Archivo, sans-serif', 'text-anchor': izq ? 'start' : 'end',
      fill: num ? (FUNCION[pin.p.red] ? '#f3e3c4' : '#7d7466') : COLOR_RED(rot === '3V3' ? '3.3V' : rot), 'font-weight': num ? 400 : 700,
      opacity: espOn ? 1 : .35, text: num ? 'GPIO ' + rot : rot, 'pointer-events': 'none' }, capaPiezasC);
  }
  const conCable = new Set();                  // los pines a los que llega un cable dibujado
  // cada cable al ESP32: sólo entre lo que está puesto
  for (const c of Object.values(CARRIL)) {
    if (!conectados.has(c.n)) continue;
    const qs = c.qs.filter(q => estaC(q.l));
    if (qs.length + (espOn ? 1 : 0) < 2) { for (const q of qs) { suelto(q); conCable.add(q); } if (espOn) { suelto(c.esp); conCable.add(c.esp); } continue; }
    const x = c.x;
    let y0 = espOn ? c.esp.y : 1e9, y1 = espOn ? c.esp.y : -1e9;
    const ys = [];
    for (const q of qs) {
      const [dx, dy] = DIR[q.sal], sx = q.x + dx * q.largo, sy = q.y + dy * q.largo;
      cable(c.n, [[q.x, q.y], [sx, sy], [x, sy]]);
      y0 = Math.min(y0, sy); y1 = Math.max(y1, sy); ys.push(sy); conCable.add(q);
    }
    if (y1 > y0) cable(c.n, [[x, y0], [x, y1]]);
    if (espOn) { cable(c.n, [[x, c.esp.y], [c.esp.x, c.esp.y]]); conCable.add(c.esp); }
    for (const sy of ys) if (sy > y0 + .1 && sy < y1 - .1) E('circle', { cx: x, cy: sy, r: 2.6, fill: COLOR_RED(c.n) }, cablesPorRed[c.n]);
  }
  // los cables entre dos piezas (la cadena de los LEDs, el MIDI): sólo si están las dos
  for (const n of LOCALES) {
    const [a, b] = REDES_C[n];
    if (!conectados.has(n)) continue;
    if (!estaC(a.l) || !estaC(b.l)) { for (const q of [a, b]) if (estaC(q.l)) { suelto(q); conCable.add(q); } continue; }
    const la = [a.x + DIR[a.sal][0] * a.largo, a.y + DIR[a.sal][1] * a.largo], lb = [b.x + DIR[b.sal][0] * b.largo, b.y + DIR[b.sal][1] * b.largo];
    let pts;
    if (a.sal === 'aba' && b.sal === 'aba') { const yy = Math.max(la[1], lb[1]) + (n === 'MIDI_OUT_4' ? 14 : 4); pts = [[a.x, a.y], [a.x, yy], [b.x, yy], [b.x, b.y]]; }
    else { const mx = (la[0] + lb[0]) / 2; pts = [[a.x, a.y], la, [mx, la[1]], [mx, lb[1]], lb, [b.x, b.y]]; }
    cable(n, pts); conCable.add(a); conCable.add(b);
  }
  // GND, 3,3 V y 5 V: una ficha en la punta de un cable corto, o un riel común si la pieza lo tiene (los LEDs).
  // Dos pines vecinos que salen hacia el mismo lado alternan el largo, así sus fichas no se pisan.
  const rieles = {};
  for (const [l, pos, , pines] of piezasC) {
    if (!estaC(l) || l.tipo === 'esp32') continue;
    const fichas = [];
    for (const q of pines) {
      if (!POTENCIA.has(q.p.red) || !conectados.has(q.p.red)) continue;
      conCable.add(q);
      if (pos.rieles && pos.rieles[q.p.red] != null) {
        const yr = pos.rieles[q.p.red];
        cable(q.p.red, [[q.x, q.y], [q.x, yr]], 2.6);
        const r = rieles[q.p.red + yr] || (rieles[q.p.red + yr] = { n: q.p.red, y: yr, x0: q.x, x1: q.x });
        r.x0 = Math.min(r.x0, q.x); r.x1 = Math.max(r.x1, q.x);
        continue;
      }
      fichas.push(q);
    }
    for (const sal of ['izq', 'der', 'arr', 'aba']) {
      const vertical = sal === 'arr' || sal === 'aba';
      const fila = fichas.filter(q => q.sal === sal).sort((a, b) => vertical ? a.x - b.x : a.y - b.y);
      let antes = null, largoAntes = 0;
      for (const q of fila) {
        const cerca = antes && Math.abs(vertical ? q.x - antes.x : q.y - antes.y) < 13;
        const largo = cerca && largoAntes <= 9 ? 22 : 8;
        const [dx, dy] = DIR[sal], fx = q.x + dx * (largo + 6), fy = q.y + dy * (largo + 6);
        cable(q.p.red, [[q.x, q.y], [q.x + dx * largo, q.y + dy * largo]], 2.2);
        bandera(q.p.red, fx, fy);
        antes = q; largoAntes = largo;
      }
    }
  }
  for (const r of Object.values(rieles)) {
    cable(r.n, [[r.x0 - 12, r.y], [r.x1, r.y]], 2.6);
    bandera(r.n, r.x0 - 18, r.y);
  }
  // las puntas: un conector en cada pin al que llega algo
  for (const q of conCable) E('circle', { cx: q.x, cy: q.y, r: 2.2, fill: COLOR_RED(q.p.red === 'GND' ? 'SCL' : q.p.red), stroke: '#000', 'stroke-width': .8 }, capaPuntas);
  // y un anillo en cada pin de una pieza puesta cuyo cable no está tirado: tocarlo lo tira
  for (const [l, , , pines] of piezasC) {
    if (!estaC(l)) continue;
    for (const q of pines) {
      const n = q.p.red;
      if (!n || conectados.has(n) || !TODAS_LAS_REDES.includes(n)) continue;
      const g = E('g', { 'data-conectar': n, style: 'cursor:pointer' }, capaAnillos);
      E('circle', { cx: q.x, cy: q.y, r: 6, fill: 'transparent' }, g);
      E('circle', { cx: q.x, cy: q.y, r: 3, fill: '#120c07', 'fill-opacity': .7, stroke: COLOR_RED(n === 'GND' ? 'SCL' : n), 'stroke-width': 1.5 }, g);
    }
  }
}
function pintarSelCables() {
  const rs = new Set(redesResaltadas());
  const hay = rs.size > 0 || elegido;
  for (const [n, g] of Object.entries(cablesPorRed)) g.setAttribute('opacity', !hay || rs.has(n) ? 1 : .16);
  capaPuntas.setAttribute('opacity', hay ? .35 : 1);
  capaMarcaC.innerHTML = '';
  const pc = piezaCDe(elegido);
  if (!pc) return;
  const [l, pos, esc] = pc, [x0, y0, x1, y1] = cajaLocal(l);
  const g = E('g', { transform: `translate(${pos.x},${pos.y}) rotate(${pos.rot}) scale(${esc})` }, capaMarcaC);
  E('rect', { x: x0 - 4, y: y0 - 4, width: x1 - x0 + 8, height: y1 - y0 + 8, fill: 'none', stroke: '#F5B041', 'stroke-width': 1.6 / esc, 'stroke-dasharray': `${5 / esc} ${3 / esc}` }, g);
}
function piezaCDe(l) {                       // la pieza de la vista de cables que corresponde a un lugar (las tiras y teclas no se dibujan)
  if (!l) return null;
  const id = { HE1: 'ESP32', HE2: 'ESP32', HD5: 'DAC', HD3: 'DAC', HI: 'IMU', HO: 'OLED' }[l.id] || (l.tipo === 'tecla' ? 'BT' + l.n : l.id);
  return piezasC.find(([m]) => m.id === id) || null;
}
// en la vista de cables no se ven las tiras hembra ni las teclas: poner un módulo pone su tira, y sacar un switch saca su tecla
function ponerEnCables(l) { for (const d of l.necesita || []) puestas.add(d); return poner(l); }
function sacarEnCables(l) { const m = encimaDe(l); if (m && m.tipo === 'tecla') puestas.delete(m.id); return sacar(l); }

// la leyenda de los colores, bajo el panel (sólo en la vista de cables)
const LEYENDA = [['GND', 'GND (tierra)'], ['3.3V', '3,3 V'], ['5V', '5 V'], ['BOTON1', 'botones'], ['POT1', 'perillas'], ['MIC1', 'piezos'],
  ['BCK', 'audio al DAC (I2S)'], ['SDA', 'I2C: SDA'], ['SCL', 'I2C: SCL'], ['WS', 'micrófono (I2S)'], ['PIXEL', 'datos de los LEDs'], ['EXT1', 'sensores externos'], ['TX', 'MIDI']];
const leyenda = document.createElement('div');
leyenda.className = 'capa leyenda';
leyenda.innerHTML = LEYENDA.map(([n, t]) => `<span><i style="background:${COLOR_RED(n)}${n === 'GND' ? ';outline:1px solid #7d7d7d' : ''}"></i>${t}</span>`).join('') +
  '<p>GND, 3,3 V y 5 V no se tiran hasta el ESP32: cada pin termina en una ficha de su color, y todas las fichas iguales están unidas.</p>';
$('escenario').appendChild(leyenda);

// ---------------------------------------------------------------- cambiar de vista
let vista = 'placa';
function ponerVista(v) {
  vista = v;
  vistaPlaca.setAttribute('display', v === 'placa' ? '' : 'none');
  vistaEsq.setAttribute('display', v === 'esquema' ? '' : 'none');
  vistaCables.setAttribute('display', v === 'cables' ? '' : 'none');
  leyenda.style.display = v === 'cables' ? '' : 'none';
  // armar y desarmar sirven en la placa y en los cables (es el mismo circuito); lo demás es sólo de la placa
  for (const [id, en] of [['bArmar', 'placa cables'], ['bDesarmar', 'placa cables'], ['bPasos', 'placa'], ['bVuelta', 'placa'], ['bPistas', 'placa'], ['bCablear', 'cables'], ['bDescablear', 'cables']])
    $(id).style.display = en.includes(v) ? '' : 'none';
  if (v === 'esquema') encuadrarEsquema();
  document.querySelectorAll('[data-vista]').forEach(b => b.classList.toggle('on', b.dataset.vista === v));
  etiqueta.textContent = '';
  if (v === 'esquema' && elegido && esqDe(elegido)) centrarEsquema(esqDe(elegido));
  pintar();
}
document.querySelectorAll('[data-vista]').forEach(b => b.onclick = () => ponerVista(b.dataset.vista));
leyenda.style.display = 'none';

// la etiqueta del puntero en el esquema y en los cables: qué red es
function etiquetaRed(e, p) {
  const s = e.target.closest && e.target.closest('[data-red],[data-lugar]');
  let txt = '';
  if (s && s.dataset.red != null && s.dataset.red !== '') txt = nombreRed(s.dataset.red);
  else if (s && s.dataset.lugar) txt = titulo(L[s.dataset.lugar]);
  etiqueta.textContent = txt;
  etiqueta.setAttribute('x', p.x + 16); etiqueta.setAttribute('y', p.y - 12);
}

// ---------------------------------------------------------------- barra
function ponerCara(c) {
  cara = c;
  caraTop.setAttribute('display', c === 'top' ? '' : 'none');
  caraBot.setAttribute('display', c === 'bot' ? '' : 'none');
  $('bVuelta').classList.toggle('on', c === 'bot');
  $('bVuelta').textContent = c === 'bot' ? 'ver por arriba' : 'dar vuelta la placa';
}
function ponerPistas(v) {
  verPistas = v;
  for (const k of ['top', 'bot']) CARAS[k].cobre.setAttribute('display', v ? '' : 'none');
  $('bPistas').classList.toggle('on', v);
}
$('bArmar').onclick = () => { for (const l of LUGARES) if (!opcional(l)) puestas.add(l.id); pintar(); };
$('bDesarmar').onclick = () => { puestas.clear(); pintar(); };
$('bPasos').onclick = () => { puestas.clear(); irAPaso(0); };
$('bVuelta').onclick = () => { ponerCara(cara === 'top' ? 'bot' : 'top'); pintar(); };
$('bPistas').onclick = () => ponerPistas(!verPistas);
$('bCablear').onclick = () => { for (const n of TODAS_LAS_REDES) conectados.add(n); pintar(); };
$('bDescablear').onclick = () => { conectados.clear(); elegidoRed = null; pintar(); };
addEventListener('keydown', e => {
  if ((e.key === 'v' || e.key === 'V') && vista === 'placa') $('bVuelta').click();
  else if ((e.key === 'p' || e.key === 'P') && vista === 'placa') $('bPistas').click();
  else if (e.key === 'Escape') { elegido = null; elegidoRed = null; pintar(); }
});

// latido de los lugares del paso a paso
const estilo = document.createElement('style');
estilo.textContent = '#esqContenido text, .mini text { paint-order:stroke; stroke:#000; stroke-opacity:.6; stroke-width:1.5px; stroke-linejoin:round; } .late { animation: late 1.3s ease-in-out infinite; } @keyframes late { 50% { stroke-opacity:.25; fill-opacity:.02; } }';
document.head.appendChild(estilo);

for (const l of LUGARES) if (!opcional(l)) puestas.add(l.id);   // parte armada
pintar();
</script>
