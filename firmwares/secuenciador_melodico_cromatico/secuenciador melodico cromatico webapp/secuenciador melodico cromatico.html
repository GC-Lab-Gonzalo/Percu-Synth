<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PercuSynth Polyphonic Sequencer</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>
    <div class="crt-overlay"></div>
    <div class="app-container">
        <header>
            <div class="title-wrap">
                <h1>PERCUSYNTH <span class="highlight">SECUENCIADOR MELODICO CROMATICO</span></h1>
            </div>
            <div class="header-actions">
                <button id="btn-play" class="btn btn-play">&#9654; START</button>
                <div class="midi-status" id="midi-status">CONECTAR SERIAL</div>
            </div>
        </header>

        <main>
            <!-- Hardware & Synth Indicators -->
            <div class="indicators panel">
                <div class="indicator">
                    <span class="label">VOL</span>
                    <div class="bar-container"><div class="bar" id="bar-vol"></div></div>
                    <span class="value" id="val-vol">--%</span>
                </div>
                <div class="indicator">
                    <span class="label">BPM</span>
                    <span class="value big" id="val-bpm">120</span>
                </div>
                <div class="indicator">
                    <span class="label">PITCH</span>
                    <span class="value big" id="val-pitch">0st</span>
                </div>
                <div class="indicator">
                    <span class="label">ATK/REL</span>
                    <span class="value" id="val-env">--</span>
                </div>
                <div class="indicator">
                    <span class="label">WAVE</span>
                    <span class="value highlight" id="val-wave">PULSE</span>
                </div>
                <div class="indicator">
                    <span class="label">DIR</span>
                    <span class="value" id="val-mode">FWD &#9654;</span>
                </div>
            </div>

            <!-- Grid Controls -->
            <div class="grid-toolbar">
                <div class="help-text">Click para poner notas (Soporta Acordes!) | [ESPACIO] Play/Pause</div>
                <div class="action-buttons">
                    <button id="btn-rand" class="btn btn-sm">RANDOM</button>
                    <button id="btn-clear" class="btn btn-sm">CLEAR</button>
                </div>
            </div>

            <!-- Sequencer Grid (12 notes x 16 steps) -->
            <div class="sequencer panel" id="sequencer-grid">
                <!-- Generated by JS -->
            </div>
        </main>
    </div>

    <script src="app.js"></script>
</body>
</html>
